<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10111b">
  <meta name="description" content="Play 8 Ball Pool online on PlayVerse. Challenge friends or play against bots in Foony's multiplayer billiards game.">
  <link rel="canonical" href="https://playverse-6a7.pages.dev/foony-8-ball-pool.html">
  <title>8 Ball Pool — PlayVerse</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body.pool-body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#173c36 0%,#10111b 54%);display:flex;flex-direction:column}
    .pool-body .site-header{width:100%}
    .pool-page{width:min(1480px,100%);margin:0 auto;padding:24px clamp(12px,2.4vw,34px) 34px;flex:1}
    .pool-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px}
    .pool-heading h1{font:700 clamp(25px,3.5vw,38px)/1.12 "Space Grotesk",sans-serif;margin:7px 0}
    .pool-heading p{color:var(--muted);font-size:13px;margin:0}
    .pool-eyebrow{display:inline-flex;align-items:center;gap:8px;color:#a7f3d0;font-size:11px;font-weight:700;letter-spacing:.14em}
    .pool-eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 14px #34d399}
    .pool-toolbar{display:flex;align-items:center;gap:9px}
    .pool-toolbar a,.pool-toolbar button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid #ffffff20;border-radius:12px;background:#ffffff08;color:#f5f7fb;text-decoration:none;font:600 13px inherit;cursor:pointer;transition:background .18s,border-color .18s}
    .pool-toolbar a:hover,.pool-toolbar button:hover{background:#ffffff13;border-color:#ffffff40}
    .pool-frame-shell{position:relative;overflow:hidden;border:1px solid #ffffff1c;border-radius:18px;background:#080c0c;box-shadow:0 24px 80px #0006}
    .pool-frame{display:block;width:100%;height:clamp(560px,calc(100vh - 210px),1000px);min-height:560px;border:0;background:#080c0c}
    .pool-footer{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:13px 3px 0;color:#9ca3af;font-size:12px;line-height:1.6}
    .pool-footer strong{color:#d1fae5;font-weight:600}
    .pool-footer a{color:#c4b5fd;text-decoration:none}
    .pool-footer a:hover{text-decoration:underline}
    @media(max-width:700px){
      .pool-page{padding:18px 10px 24px}
      .pool-heading{align-items:flex-start;flex-direction:column;margin-bottom:13px}
      .pool-toolbar{width:100%}
      .pool-toolbar a,.pool-toolbar button{flex:1}
      .pool-frame-shell{border-radius:12px}
      .pool-frame{height:calc(100dvh - 220px);min-height:440px}
      .pool-footer{align-items:flex-start;flex-direction:column;gap:5px}
    }
    @media(max-width:420px){.pool-frame{height:calc(100dvh - 235px);min-height:400px}}
  </style>
</head>
<body class="pool-body">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="PlayVerse home"><img src="logo.svg" alt="" width="35" height="35" style="border-radius:12px"><span>play<span class="brand-light">verse</span></span></a>
    <div class="header-actions"><a class="header-cta" href="index.html#games">All games <span>↗</span></a></div>
  </header>
  <main class="pool-page">
    <div class="pool-heading">
      <div><span class="pool-eyebrow">SPORTS · MULTIPLAYER</span><h1>8 Ball Pool</h1><p>Challenge a friend, practice against bots, and sink the 8 ball.</p></div>
      <div class="pool-toolbar">
        <a href="index.html#games" aria-label="Back to all games">← All games</a>
        <button type="button" id="poolFullscreen" aria-label="Enter fullscreen">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="pool-frame-shell" id="poolFrameShell">
      <iframe class="pool-frame" id="poolFrame" src="https://foony.com/games/8-ball-pool-online-billiards?description=true" title="8 Ball Pool Billiards Multiplayer" allow="fullscreen; autoplay; clipboard-write; gamepad" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <div class="pool-footer">
      <span><strong>Powered by Foony</strong> · Your game stays right here on PlayVerse.</span>
      <span>For best results, allow the game to load and use landscape mode on mobile.</span>
    </div>
  </main>
  <script>
    const poolFrameShell = document.getElementById('poolFrameShell');
    const fullscreenButton = document.getElementById('poolFullscreen');
    fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (poolFrameShell.requestFullscreen) {
          await poolFrameShell.requestFullscreen();
        }
      } catch (error) {
        fullscreenButton.textContent = 'Fullscreen unavailable';
        window.setTimeout(() => { fullscreenButton.textContent = '⛶ Fullscreen'; }, 1800);
      }
    });
    document.addEventListener('fullscreenchange', () => {
      fullscreenButton.textContent = document.fullscreenElement ? '× Exit fullscreen' : '⛶ Fullscreen';
    });
  </script>
</body>
</html>
