<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111b"><meta name="description" content="Play classic table tennis. Move your paddle with W/S or the up/down arrow keys. First to five points wins."><title>Pong | PlayVerse</title><link rel="icon" href="logo.svg"><link rel="stylesheet" href="styles.css"><style>
body{min-height:100vh;background:#10111b;color:#f5f4ff;font-family:"DM Sans",sans-serif}.mini-game{width:min(850px,calc(100% - 28px));margin:34px auto 60px}.back-link{display:inline-block;color:#c5b5ff;text-decoration:none;margin-bottom:18px}.game-shell{border:1px solid #ffffff18;background:#191a28;border-radius:20px;padding:clamp(16px,4vw,30px);box-shadow:0 20px 60px #0004}.game-shell h1{font:700 clamp(28px,5vw,42px) "Space Grotesk";margin:4px 0 8px}.game-shell p{color:#aaa9c2;font-size:13px;line-height:1.7}.game-stage{display:grid;place-items:center;margin:20px auto;max-width:100%;overflow:hidden}.game-stage canvas{display:block;max-width:100%;border:1px solid #ffffff1a;border-radius:12px;background:#101426;touch-action:manipulation}.game-tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.game-tools button,.color-pad button{border:1px solid #ffffff20;background:#29263d;color:white;padding:11px 16px;border-radius:10px;cursor:pointer}.game-tools button:hover{border-color:#a18aff}.score-line{text-align:center;color:#d7ccff;font-weight:700;margin:12px}.color-pad{display:grid;grid-template-columns:repeat(2,minmax(110px,150px));gap:12px;justify-content:center;margin:22px auto}.color-pad button{height:100px;opacity:.85}.color-pad button.lit{opacity:1;filter:brightness(1.65);box-shadow:0 0 25px #ffffff3b;transform:scale(1.03)}.green{background:#238d68!important}.red{background:#bd4262!important}.yellow{background:#c79b37!important}.blue{background:#4269c7!important}@media(max-width:520px){.game-stage canvas{width:100%;height:auto}.color-pad button{height:80px}}
</style></head><body><main class="mini-game"><a class="back-link" href="index.html">← Back to PlayVerse</a><section class="game-shell"><span class="eyebrow">FREE BROWSER GAME</span><h1>Pong</h1><p>Play classic table tennis. Move your paddle with W/S or the up/down arrow keys. First to five points wins.</p><div class="score-line" id="score">YOU 0 — 0 CPU</div><div class="game-stage"><canvas id="game" width="720" height="420" aria-label="Pong game"></canvas></div><div class="game-tools"><button id="start">Start / Restart</button><button onclick="location.href='index.html'">Game library</button></div><p style="text-align:center">Controls: W / S or ↑ / ↓</p></section></main><script>const c=document.querySelector('#game'),x=c.getContext('2d'),score=document.querySelector('#score');let y=170,cy=170,bx=360,by=210,vx=5,vy=3,ps=0,cs=0,run=false;function reset(){y=170;cy=170;bx=360;by=210;vx=Math.random()>.5?5:-5;vy=(Math.random()-.5)*6}function draw(){x.clearRect(0,0,720,420);x.fillStyle='#15172b';x.fillRect(0,0,720,420);x.setLineDash([9,12]);x.strokeStyle='#ffffff55';x.beginPath();x.moveTo(360,0);x.lineTo(360,420);x.stroke();x.setLineDash([]);x.fillStyle='#a18aff';x.fillRect(25,y,13,80);x.fillStyle='#63e6d2';x.fillRect(682,cy,13,80);x.fillStyle='white';x.beginPath();x.arc(bx,by,9,0,Math.PI*2);x.fill();if(run){bx+=vx;by+=vy;cy+=Math.sign(by-(cy+40))*Math.min(4,Math.abs(by-(cy+40)));if(by<9||by>411)vy*=-1;if(bx<43&&by>y-4&&by<y+84){vx=Math.abs(vx)*1.04;vy+=((by-y-40)/20)}if(bx>677&&by>cy-4&&by<cy+84){vx=-Math.abs(vx)*1.04;vy+=((by-cy-40)/20)}if(bx<0){cs++;reset()}if(bx>720){ps++;reset()}score.textContent='YOU '+ps+' — '+cs+' CPU';if(ps>=5||cs>=5){run=false;score.textContent=(ps>cs?'YOU WIN! ':'CPU WINS! ')+ps+' — '+cs}}requestAnimationFrame(draw)}document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')y=Math.max(0,y-24);if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')y=Math.min(340,y+24)});document.querySelector('#start').onclick=()=>{ps=cs=0;reset();run=true};draw();</script><script>
if(new URLSearchParams(location.search).has("preview")){
  const css=document.createElement("style");
  css.textContent=`
    html,body{width:100%;height:100%;min-height:0!important;margin:0!important;overflow:hidden!important;background:#10111b!important}
    .mini-game{width:100%!important;height:100vh!important;margin:0!important}
    .back-link,.game-shell>.eyebrow,.game-shell>h1,.game-shell>p,.game-tools{display:none!important}
    .game-shell{position:relative;width:100%;height:100%;min-height:0;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;display:flex;flex-direction:column}
    .score-line{position:absolute;z-index:3;top:5px;left:5px;margin:0;padding:3px 6px;border-radius:5px;background:#10111dcc;font-size:10px!important}
    .game-stage{flex:1;min-height:0;width:100%;height:100%;margin:0!important;overflow:hidden}
    .game-stage canvas{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain;border:0!important;border-radius:0!important}
    .color-pad{flex:1;min-height:0;width:100%;height:100%;margin:0!important;padding:18px 5px 5px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px}
    .color-pad button{height:auto!important;min-height:0;border-radius:9px}
  `;
  document.head.append(css);
  addEventListener("load",()=>setTimeout(()=>document.querySelector("#start")?.click(),120),{once:true});
}
</script></body></html>
