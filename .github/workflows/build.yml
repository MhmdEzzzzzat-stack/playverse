name: Validate PlayVerse build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PlayVerse
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Build PlayVerse and self-hosted arcade
        run: npm run build

      - name: Verify expected output
        run: |
          test -f dist/index.html
          test -f dist/arcade/index.html
          test -f dist/arcade/manifest.webmanifest
          node -e "const m = require('./dist/arcade/manifest.webmanifest'); if (m.scope !== '/arcade/' || m.start_url !== '/arcade/') process.exit(1)"
