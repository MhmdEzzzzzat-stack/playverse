<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play Brick Breaker free online. Bounce the ball, break every brick, and beat your high score."><link rel="canonical" href="https://playverse-6a7.pages.dev/breakout.html"><link rel="icon" href="logo.svg" type="image/svg+xml"><title>Brick Breaker — PlayVerse</title><style>body{padding:24px;background:#10111b;color:#f6f5ff;font:16px system-ui;text-align:center}.wrap{max-width:800px;margin:auto}.brand{display:flex;gap:10px;align-items:center;color:white;text-decoration:none;font-weight:800}.brand img{width:38px}canvas{display:block;width:100%;margin:20px auto;background:#171824;border-radius:14px;touch-action:pan-y}button{cursor:pointer;padding:12px 18px;border:0;border-radius:10px;background:#8c73f0;color:white;font-weight:700}.status{color:#c9bbff}a{color:#c9bbff}</style></head><body><div class="wrap"><a class="brand" href="index.html"><img src="logo.svg">PlayVerse</a><h1>Brick Breaker</h1><p>Break every brick. Move with arrow keys or mouse/touch.</p><p id="status" class="status">Score: 0 · Lives: 3</p><canvas id="c" width="720" height="430"></canvas><button id="restart">Restart game</button><p><a href="index.html#games">← Back to all games</a></p></div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#status');let ball,pad,bricks,score,lives,run,raf;function reset(){cancelAnimationFrame(raf);ball={x:360,y:330,dx:3.4,dy:-4};pad={x:300,w:120};bricks=[];for(let r=0;r<5;r++)for(let col=0;col<9;col++)bricks.push({x:18+col*77,y:35+r*27,w:68,h:17,on:true,color:['#a18aff','#ff8bc7','#70ecd2','#ffd58d'][r%4]});score=0;lives=3;run=true;draw()}function draw(){x.clearRect(0,0,720,430);bricks.forEach(b=>{if(b.on){x.fillStyle=b.color;x.fillRect(b.x,b.y,b.w,b.h)}});x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,8,0,7);x.fill();x.fillStyle='#a18aff';x.fillRect(pad.x,390,pad.w,12);s.textContent='Score: '+score+' · Lives: '+lives;if(run){ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<8||ball.x>712)ball.dx*=-1;if(ball.y<8)ball.dy*=-1;if(ball.y+8>390&&ball.y<402&&ball.x>pad.x&&ball.x<pad.x+pad.w)ball.dy=-Math.abs(ball.dy);for(const b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=false;ball.dy*=-1;score+=10;break}if(ball.y>430){lives--;if(lives<=0){run=false;s.textContent='Game over · Score: '+score}else{ball.x=360;ball.y=330;ball.dy=-4}}if(bricks.every(b=>!b.on)){run=false;s.textContent='You cleared the board! Score: '+score}raf=requestAnimationFrame(draw)}}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();pad.x=Math.max(0,Math.min(600,(e.clientX-r.left)*720/r.width-pad.w/2))});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pad.x=Math.max(0,pad.x-28);if(e.key==='ArrowRight')pad.x=Math.min(600,pad.x+28)});document.querySelector('#restart').onclick=reset;reset();</script></body></html>
