<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Test your reaction speed online for free. Wait for green, click fast, and measure your reflexes."><link rel="canonical" href="https://playverse-6a7.pages.dev/reaction-test.html"><link rel="icon" href="logo.svg" type="image/svg+xml"><title>Reaction Test — PlayVerse</title><style>body{margin:0;padding:24px;background:#10111b;color:#f6f5ff;font:16px system-ui;text-align:center}.wrap{max-width:800px;margin:auto}.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:white;font-weight:800}.brand img{width:38px}a{color:#c9bbff}button{cursor:pointer;border:1px solid #ffffff22;border-radius:14px;padding:18px;background:#29223f;color:white;font-size:24px;width:100%;min-height:250px;margin:30px 0}.status{color:#c9bbff}</style></head><body><div class="wrap"><a class="brand" href="index.html"><img src="logo.svg">PlayVerse</a><h1>Reaction Test</h1><p>Wait for green, then click as fast as you can.</p><button id="arena">Click to start</button><p id="status" class="status">Best: —</p><p><a href="index.html#games">← Back to all games</a></p></div><script>let phase='idle',timer,start,best=null;const a=document.querySelector('#arena'),s=document.querySelector('#status');a.onclick=()=>{if(phase==='idle'||phase==='done'){phase='wait';a.style.background='#b44a70';a.textContent='Wait for green…';timer=setTimeout(()=>{phase='ready';start=performance.now();a.style.background='#159b79';a.textContent='CLICK NOW!'},1200+Math.random()*2500)}else if(phase==='wait'){clearTimeout(timer);phase='done';a.textContent='Too soon! Click to retry'}else{let ms=Math.round(performance.now()-start);best=best===null?ms:Math.min(ms,best);phase='done';a.style.background='#29223f';a.textContent=ms+' ms — click to retry';s.textContent='This time: '+ms+' ms · Best: '+best+' ms'}};</script></body></html>
