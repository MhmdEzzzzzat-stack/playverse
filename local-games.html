<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111b"><title>PlayVerse Arcade</title><style>
:root{color-scheme:dark;--bg:#10111b;--panel:#191b2c;--purple:#9c7cff;--text:#f7f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#29214a 0,transparent 48%),var(--bg);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(16px,calc((100vw - 1050px)/2));border-bottom:1px solid #ffffff16}.brand{font-weight:900;font-size:19px;letter-spacing:-.04em}.brand span{color:#b9a6ff}a,button{color:inherit}a{color:#c9bcff;text-decoration:none}.wrap{width:min(1000px,100% - 28px);margin:24px auto;flex:1}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{color:#b9a6ff;font-size:11px;font-weight:800;letter-spacing:.16em}.head h1{margin:5px 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.04em}.head p{color:#b8bbd0;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #ffffff20;background:#25263b;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700}button.primary{background:var(--purple);border-color:transparent}.stage{position:relative;border:1px solid #ffffff20;background:#080910;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px #0005}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:manipulation}.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 8px #000;font-weight:800}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#080910b8;backdrop-filter:blur(5px)}.overlay h2{font-size:clamp(26px,5vw,44px);margin:0 0 8px}.overlay p{color:#d0d0e1;max-width:440px;line-height:1.6}.overlay button{justify-self:center;padding:12px 22px}.help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#b8bbd0;font-size:13px;padding:14px 3px}.touch{display:none;gap:12px;justify-content:center;margin-top:12px}.touch button{width:76px;height:54px;font-size:20px}@media(max-width:650px){.touch{display:flex}.top{padding:14px}.wrap{margin:18px auto}.head p{font-size:13px}.stage{border-radius:13px}.help{font-size:12px}}
</style></head><body><header class="top"><div class="brand">play<span>verse</span> ARCADE</div><a href="index.html">← Back to games</a></header><main class="wrap"><div class="head"><div><div class="eyebrow">PLAY INSIDE PLAYVERSE</div><h1 id="title">Arcade Game</h1><p id="subtitle">Original browser game · no downloads</p></div><div class="actions"><button id="restart">↻ Restart</button><button id="pause">Ⅱ Pause</button><button id="full" class="primary">⛶ Fullscreen</button></div></div><div class="stage" id="stage"><canvas id="game" width="960" height="540" aria-label="Playable game area"></canvas><div class="hud"><span id="score">SCORE 000</span><span id="best">BEST 000</span></div><div class="overlay" id="overlay"><div class="eyebrow">READY PLAYER</div><h2 id="overlayTitle">Ready to play?</h2><p id="overlayText">Jump in, avoid obstacles, and beat your high score.</p><button id="start" class="primary">▶ Start game</button></div></div><div class="touch"><button id="left">◀</button><button id="jump">▲ JUMP</button><button id="right">▶</button></div><div class="help"><span id="controls">Controls: Space / ↑ to jump</span><span>Progress saves on this device</span></div></main><script>
(()=>{const qs=new URLSearchParams(location.search),mode=qs.get('game')||'runner',canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');const configs={runner:{title:'Neon Runner',sub:'An endless runner challenge',desc:'Jump over glowing barriers. How far can you go?',controls:'Space / ↑ / tap to jump',color:'#a78bfa'},kart:{title:'Turbo Kart Arena',sub:'Arcade lane-racing challenge',desc:'Dodge traffic, switch lanes, and survive the arena.',controls:'← → or A / D to switch lanes',color:'#fb7185'},platform:{title:'Trap Tower',sub:'A precision platform challenge',desc:'Jump between platforms and avoid the traps.',controls:'← → to move · Space / ↑ to jump',color:'#34d399'}};const cfg=configs[mode]||configs.runner;document.title=cfg.title+' | PlayVerse';document.querySelector('#title').textContent=cfg.title;document.querySelector('#subtitle').textContent=cfg.sub;document.querySelector('#controls').textContent=cfg.controls;let running=false,paused=false,over=false,score=0,best=+(localStorage.getItem('pv-'+mode+'-best')||0),tick=0,last=0,player={x:150,y:400,vy:0,lane:1},obstacles=[],keys={};document.querySelector('#best').textContent='BEST '+String(best).padStart(3,'0');function reset(){running=false;paused=false;over=false;score=0;tick=0;last=0;player={x:150,y:400,vy:0,lane:1};obstacles=[];overlay.style.display='grid';document.querySelector('#overlayTitle').textContent='Ready to play?';document.querySelector('#overlayText').textContent=cfg.desc;document.querySelector('#start').textContent='▶ Start game';document.querySelector('#pause').textContent='Ⅱ Pause';draw(0)}function begin(){if(over)reset();running=true;paused=false;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}function end(){running=false;over=true;best=Math.max(best,Math.floor(score));localStorage.setItem('pv-'+mode+'-best',best);document.querySelector('#best').textContent='BEST '+String(best).padStart(3,'0');overlay.style.display='grid';document.querySelector('#overlayTitle').textContent='Run over';document.querySelector('#overlayText').textContent='Score: '+Math.floor(score)+' · Best: '+best+'. Try again and beat it!';document.querySelector('#start').textContent='↻ Play again'}function jump(){if(!running){if(!over)begin();return}if(mode==='kart'){player.lane=(player.lane+1)%3;return}if(player.y>=399){player.vy=-650}}function move(d){if(mode==='kart')player.lane=Math.max(0,Math.min(2,player.lane+d));else player.x=Math.max(45,Math.min(900,player.x+d*38))}function keydown(e){if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='Escape'&&running){paused=!paused;document.querySelector('#pause').textContent=paused?'▶ Resume':'Ⅱ Pause';if(!paused){last=performance.now();requestAnimationFrame(loop)}}}function keyup(e){keys[e.code]=false}window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);document.querySelector('#start').onclick=begin;document.querySelector('#restart').onclick=reset;document.querySelector('#pause').onclick=()=>{if(!running)return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶ Resume':'Ⅱ Pause';if(!paused){last=performance.now();requestAnimationFrame(loop)}};document.querySelector('#full').onclick=()=>{const s=document.querySelector('#stage');if(!document.fullscreenElement)s.requestFullscreen?.();else document.exitFullscreen?.()};document.querySelector('#jump').onclick=jump;document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);canvas.addEventListener('pointerdown',e=>{if(mode==='runner')jump();else if(mode==='kart')move(e.offsetX<canvas.clientWidth/2?-1:1);else if(e.offsetX<canvas.clientWidth/2)move(-1);else move(1)});function rect(x,y,w,h,c,r=8){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(dt){const w=960,h=540;ctx.clearRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#15152b');g.addColorStop(1,'#090b15');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<70;i++){let x=(i*137)%w,y=(i*83)%350;ctx.fillStyle='rgba(255,255,255,'+(.12+(i%4)*.08)+')';ctx.fillRect(x,y,2,2)}if(mode==='kart'){ctx.fillStyle='#202239';ctx.beginPath();ctx.moveTo(250,0);ctx.lineTo(710,0);ctx.lineTo(900,540);ctx.lineTo(60,540);ctx.closePath();ctx.fill();for(let i=1;i<3;i++){ctx.strokeStyle='#ffffff35';ctx.setLineDash([24,22]);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(250+i*153,0);ctx.lineTo(60+i*280,540);ctx.stroke();ctx.setLineDash([])}rect(70,0,16,540,'#9c7cff');rect(874,0,16,540,'#9c7cff')}else{rect(0,435,960,105,'#1b2540');for(let i=0;i<16;i++){rect((i*90-(tick*3)%90),435,40,5,cfg.color,2)}if(mode==='platform'){for(let i=0;i<6;i++){let x=i*170+40;rect(x,420-(i%2)*75,115,16,i%2?'#356e70':'#3761a0',4);if(i%2===1)rect(x+45,435,20,20,'#fb7185',4)}}}if(mode==='runner'){for(const o of obstacles){rect(o.x,435-o.h,o.w,o.h,o.c,7);rect(o.x+6,435-o.h+8,5,Math.max(8,o.h-16),'#ffffff65',2)}rect(player.x,player.y,42,42,cfg.color,10);rect(player.x+8,player.y+9,8,8,'#fff',3);rect(player.x+25,player.y+9,8,8,'#fff',3)}else if(mode==='kart'){const laneX=[360,480,600];for(const o of obstacles){rect(laneX[o.lane]-26,o.y,52,80,o.c,12);rect(laneX[o.lane]-17,o.y+12,12,15,'#fff',3);rect(laneX[o.lane]+5,o.y+12,12,15,'#fff',3)}rect(laneX[player.lane]-30,390,60,100,cfg.color,15);rect(laneX[player.lane]-21,404,14,19,'#fff',4);rect(laneX[player.lane]+7,404,14,19,'#fff',4);rect(laneX[player.lane]-38,466,76,12,'#090b15',5)}else{rect(player.x,player.y,42,42,cfg.color,10);rect(player.x+8,player.y+9,8,8,'#fff',3);rect(player.x+25,player.y+9,8,8,'#fff',3);for(let i=0;i<4;i++)rect(270+i*150,418-(i%2)*73,45,7,'#fb7185',3)}document.querySelector('#score').textContent='SCORE '+String(Math.floor(score)).padStart(3,'0')}function loop(now){if(!running||paused)return;let dt=Math.min(.032,(now-last)/1000||0);last=now;tick+=dt*100;score+=dt*(mode==='kart'?15:10);if(mode==='runner'){player.vy+=1500*dt;player.y+=player.vy*dt;if(player.y>393){player.y=393;player.vy=0}if(Math.random()<dt*.85)obstacles.push({x:980,w:25+Math.random()*25,h:35+Math.random()*65,c:Math.random()>.5?'#fb7185':'#fbbf24'});obstacles.forEach(o=>o.x-=360*dt);obstacles=obstacles.filter(o=>o.x>-60);if(obstacles.some(o=>player.x+35>o.x&&player.x<o.x+o.w&&player.y+38>435-o.h))return end()}else if(mode==='kart'){if(Math.random()<dt*.8)obstacles.push({lane:Math.floor(Math.random()*3),y:-100,c:['#fb7185','#60a5fa','#fbbf24'][Math.floor(Math.random()*3)]});obstacles.forEach(o=>o.y+=310*dt);obstacles=obstacles.filter(o=>o.y<600);if(obstacles.some(o=>o.lane===player.lane&&o.y>390&&o.y<475))return end()}else{player.vy+=1300*dt;player.y+=player.vy*dt;if(keys.ArrowLeft||keys.KeyA)player.x-=260*dt;if(keys.ArrowRight||keys.KeyD)player.x+=260*dt;player.x=Math.max(15,Math.min(900,player.x));if(player.y>500)return end();if(player.y>390&&player.y<440&&player.vy>0){player.y=390;player.vy=0}}draw(dt);requestAnimationFrame(loop)}reset()})();
</script></body></html>
